syntax = "proto2";

message autofs_entry {
	required int32		fd			= 1;
	required int32		pgrp			= 2;
	required int32		pgrp_pid_ns_id	= 3;
	required int32		timeout			= 4;
	required int32		minproto		= 5;
	required int32		maxproto		= 6;
	required int32		mode			= 7;

	optional int32		uid			= 8;
	optional int32		gid			= 9;

	optional int32		read_fd			= 10;
}
